name: repo-restructure

on:
  push:
    branches:
      - refactor/repo-restructure

permissions:
  contents: write

jobs:
  restructure:
    if: github.repository == 'Libai-88/3NEW' && contains(github.event.head_commit.message, '[run-restructure]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repo-restructure
          fetch-depth: 0

      - name: Fetch restructure assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://aka.doubaocdn.com/s/tO5cbOUNhb -o .github/restructure.py
          curl -fsSL --retry 3 https://aka.doubaocdn.com/s/x4by73dMT3 -o README.md
          echo 'bfa8df6a8372fcbab9eb4046c190e36a875971a107f56dd42f7d7bd309745be1  .github/restructure.py' | sha256sum -c -
          echo 'f0e33b56b8ab61b17fa7a35c3c0c303318bcbcc22f952a34a79585a9b9845941  README.md' | sha256sum -c -

      - name: Apply repository restructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 1. Remove the Phase 1 tree. Root README stays (already replaced).
          git rm -r -q code data models report || true

          # 2. Remove the Web workbench and its launchers.
          git rm -r -q generalization/workbench/webapp || true
          git rm -q generalization/workbench/start_webapp.sh generalization/workbench/start_webapp.bat || true

          # 3. Remove the old generalized README so the move cannot collide.
          git rm -q generalization/README.md || true

          # 4. Promote the remaining generalization tree to the repository root.
          shopt -s dotglob nullglob
          for p in generalization/*; do
            git mv "$p" .
          done
          rmdir generalization 2>/dev/null || true

          # 5. Apply the in-place text edits (paths, data snapshot, pkl fallback).
          python3 .github/restructure.py

          # 6. Remove the temporary workflow, script, and trigger file.
          git rm -f .github/restructure.py .github/workflows/refactor-restructure.yml .github/trigger.txt || true

          # 7. Commit and push the final tree.
          git add -A
          git commit -m 'refactor: promote generalization to repo root and remove web workbench [skip ci]'
          git push origin HEAD:refactor/repo-restructure
